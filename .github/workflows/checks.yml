name: checks

# Required check on `main` (branch protection). Python extraction pipeline;
# CI uses no secrets and does not need the M5 PDF volume.
#
# Baseline-aware gate (2026-10-25): the full suite has known environment-
# dependent tests (they read /Volumes/M5_4TB/... which exists only on the M5)
# and a small set of known defects tracked as beads. We DESELECT THOSE EXACT
# NODE IDS so every other test still runs and any NEW failure is red.
#
# The list is intentionally narrow (node ids, not whole files) so tests sharing
# a file with a known failure are still executed. As fixes land (PR #44, #46)
# those node ids simply stop being selected — and `bd`-tracked debt shrinks.
#
# To burn down: fix a defect, delete its line here in the same PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision]"
      - name: pytest (baseline-aware)
        shell: bash
        run: |
          set -o pipefail

          # Environment: require the M5 PDF volume (/Volumes/M5_4TB/...). Whole
          # files — every test in them needs the vault.
          ENV_DESELECT=(
            "tests/test_crop_verify.py"
            "tests/test_region_detect.py"
          )

          # Known defects tracked as beads. Exact node ids so sibling tests in
          # the same file still run. Each MUST correspond to a bead.
          #   director-suite (8): day-1 item #2 triage  -> bead TBD
          #   discovery lifecycle: sqlite path on CI
          # Burned down 2026-10-25: electronics (PR #46) + fleet_state (PR #44)
          # landed, so their entries were removed — the gate now runs them.
          KNOWN_DESELECT=(
            "tests/test_director_01a.py::test_backfill_suppression"
            "tests/test_director_01b.py::test_consumer_level_idempotency_after_truncation"
            "tests/test_director_02.py::test_fleet_events_flow_through_rules"
            "tests/test_director_02.py::test_llm_total_outage_with_policy_ingestion_continues"
            "tests/test_director_02.py::test_service_down_machine_online_distinction"
            "tests/test_director_03.py::test_total_model_outage_including_subscription"
            "tests/test_director_consumer.py::test_model_assessment_never_fact"
            "tests/test_director_consumer.py::test_sam_reserved_generates_escalation_draft_only"
            "tests/test_discovery_api.py::test_design_lifecycle"
          )

          # Environment: sandbox-isolation tests that cannot run on GitHub-hosted
          # runners. macOS uses sandbox-exec; Linux needs bwrap with user
          # namespaces, which hosted runners forbid
          # ("bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted").
          # They pass locally/on a host with CAP_NET_ADMIN. Tracked: bead TBD.
          SANDBOX_DESELECT=(
            "tests/test_code_curriculum.py::test_builds_executable_curriculum_from_owned_repository"
            "tests/test_coding_qualification.py::test_frozen_fixture_digest_and_parents"
            "tests/test_shadow_replay.py::test_local_patch_requires_fail_before_and_pass_after"
            "tests/test_shadow_replay.py::test_named_preexisting_failure_may_remain_without_regression"
            "tests/test_shadow_replay.py::test_only_mechanically_proven_frontier_correction_is_admitted"
            "tests/test_shadow_replay.py::test_frontier_final_state_replays_against_same_parent"
          )

          DESELECT=()
          for t in "${ENV_DESELECT[@]}"; do
            [ -f "$t" ] || { echo "::error::env-deselect entry not found: $t"; exit 1; }
            DESELECT+=(--deselect "$t")
          done
          for t in "${SANDBOX_DESELECT[@]}"; do
            test_file="${t%%::*}"
            [ -f "$test_file" ] || { echo "::error::sandbox-deselect entry not found: $test_file"; exit 1; }
            DESELECT+=(--deselect "$t")
          done
          for t in "${KNOWN_DESELECT[@]}"; do
            test_file="${t%%::*}"
            [ -f "$test_file" ] || { echo "::error::known-deselect entry not found: $test_file"; exit 1; }
            DESELECT+=(--deselect "$t")
          done

          python -m pytest -q "${DESELECT[@]}" 2>&1 | tee pytest.out
# Triggers a CI run so the "checks" status becomes selectable in the
# protect-main ruleset (GitHub only offers checks it has seen recently).
