[package]
name = "dw-extract"
description = "Extraction surface: document -> structured facts. Port of harness/electronics/{extraction,bom_extract,key_features_grid}.py. Gate: extraction gold."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dw-types = { path = "../dw-types" }

# Python `re` semantics require lookaround: `key_features_grid.py` uses
# `(?<=[A-Za-z])[0-9]{1,2}$`, `(?!/MHz)`, `(?!\s*\(sram)`. The `regex` crate
# cannot express these. `fancy-regex` can, and is the only reason this
# dependency exists (same call as dw-normalize / dw-truth; docs/HANDOFF.md §6).
fancy-regex = "0.14"

[dev-dependencies]

[lints]
workspace = true
