name: neo-gascity

# CI receipt for the NEO<->Gas City bridge (PR #52). Stdlib-only offline
# suite: authorization integrity, proof-gated receipts, atomic ledger,
# publisher stability/sanitization/guards. No secrets, no network.

on:
  pull_request:
    branches: [main]
    paths: ["neo-gascity/**"]
  push:
    branches: [main]
    paths: ["neo-gascity/**"]

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: bridge unit + negative-control suite
        run: python3 -m unittest discover -s neo-gascity/tests -v
      - name: schema sanity (both contracts load and self-validate shape)
        run: |
          python3 - <<'EOF'
          import sys, json
          sys.path.insert(0, "neo-gascity")
          from bridge import schema as SC
          for name in ("dw.finding.v1.json", "dw.approval.gascity-ingest.v1.json"):
              s = SC.load_schema(name)
              assert isinstance(s, dict) and "properties" in s, name
          print("schemas ok")
          EOF
