# cargo-deny — mechanical license and supply-chain policy.
#
# PLAN §10: "cargo-deny rejects AGPL mechanically."
# D1: PDFium is BSD-3; MuPDF is AGPL. This file is what stops the AGPL
# engine from creeping in through a transitive dependency.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8

# The allowlist is deliberately narrow. AGPL is absent on purpose: PLAN §11
# and D1 both turn on avoiding AGPL in anything we ship or network.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
]

# Everything not in `allow` is denied by default. AGPL is absent from that
# list on purpose, which is what makes PLAN §10 / D1 mechanical:
# a BSD-3-or-better engine is the only thing that can link here.
#
# Rejected by omission (explicitly, for legibility):
#   AGPL-1.0/3.0, SSPL-1.0, BUSL-1.1,
#   GPL-2.0/3.0, LGPL-2.0/2.1/3.0, CDDL-1.0, MS-RL
#
# The allowlist is deliberately narrow.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
