description = """
NEO P3 staging fixture — three sequential deterministic steps proving the
native workloop: admission → routed step → cold-pool spawn → atomic claim →
durable completion → dependency transition → next step, unattended.

STAGING ONLY. Harmless tasks: append one line to PROOF.md per step.
"""
formula = "neo-fixture-seq"

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "one"
title = "Fixture step one: append PROOF.md line and close"
description = """
Your step bead IS the task (GC_BEAD_ID). Work only inside your work_dir.

**1. Claim and heartbeat:**
```bash
gc bd update "$GC_BEAD_ID" --claim
gc bd heartbeat "$GC_BEAD_ID"
```

**2. Do the work (exactly this, nothing else):**
```bash
cd "$PWD" && printf "step-one done %s\\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> PROOF.md
git add PROOF.md && git commit -qm "fixture: step one" || true
```

**3. Close the step bead:**
```bash
COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
gc bd update "$GC_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=shipped \
  --set-metadata gc.work_commit="$COMMIT" \
  --status=closed \
  --append-notes "Fixture step one complete: PROOF.md line appended."
```

Exit criteria: PROOF.md has your line and your step bead is closed.
"""

[[steps]]
id = "two"
title = "Fixture step two: append PROOF.md line and close"
needs = ["one"]
description = """
Your step bead IS the task (GC_BEAD_ID). Work only inside your work_dir.

**1. Claim and heartbeat:**
```bash
gc bd update "$GC_BEAD_ID" --claim
gc bd heartbeat "$GC_BEAD_ID"
```

**2. Do the work (exactly this, nothing else):**
```bash
cd "$PWD" && printf "step-two done %s\\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> PROOF.md
git add PROOF.md && git commit -qm "fixture: step two" || true
```

**3. Close the step bead:**
```bash
COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
gc bd update "$GC_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=shipped \
  --set-metadata gc.work_commit="$COMMIT" \
  --status=closed \
  --append-notes "Fixture step two complete: PROOF.md line appended."
```

Exit criteria: PROOF.md has your line and your step bead is closed.
"""

[[steps]]
id = "three"
title = "Fixture step three: append final PROOF.md line and close"
needs = ["two"]
description = """
Your step bead IS the task (GC_BEAD_ID). Work only inside your work_dir.

**1. Claim and heartbeat:**
```bash
gc bd update "$GC_BEAD_ID" --claim
gc bd heartbeat "$GC_BEAD_ID"
```

**2. Do the work (exactly this, nothing else):**
```bash
cd "$PWD" && printf "step-three done %s — workflow complete\\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> PROOF.md
git add PROOF.md && git commit -qm "fixture: step three" || true
```

**3. Close the step bead:**
```bash
COMMIT=$(git rev-parse HEAD 2>/dev/null || true)
gc bd update "$GC_BEAD_ID" \
  --set-metadata gc.outcome=pass \
  --set-metadata gc.work_outcome=shipped \
  --set-metadata gc.work_commit="$COMMIT" \
  --status=closed \
  --append-notes "Fixture step three complete: workflow finished."
```

Exit criteria: PROOF.md has your line and your step bead is closed.
"""
