    notes: gx10-0309 samkimasus3; Nemotron 3.5 Lightning 30B-A3B NVFP4; primary local critic and researcher/tester ONLY — never foreman. With obsolete thinking retries removed it scored 7/7 in 3.78s alone and 7/7 in 5.47s or less across four concurrent grades; not a coder and not in the coding failover ladder. 2026-10-09 VERIFIED DARK — asus3 is alive as TP4 rank 3 (container dsv41-worker) but nothing listens on :8900, so this lane refuses connection in ~11 ms (cheap, not a hang) and the ladder falls through to the next critic. Kept enabled:true on purpose because it is meant to return when asus3 leaves the TP4 set. Two things to know while it is dark — (a) Worker.status() derives "healthy" from config alone with no liveness probe (harness/workers/registry.py:32), so this lane reports healthy while unreachable, and the fleet probe is the only thing that tells the truth (endpoint key asus3_nemotron); (b) the only other enabled critic is dsv41_flash on the same TP4 endpoint that does the work, so proposer == critic on review lanes. Adjudication is unaffected — canon (asus4:8900 + dgx1:8901) is a different model with REJECT authority. Whether to flip enabled:false or give asus3 its GPU back is Sam's call.

