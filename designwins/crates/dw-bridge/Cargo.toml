[package]
name = "dw-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dw-bridge"
path = "src/main.rs"

[dependencies]
dw-normalize = { path = "../dw-normalize" }
dw-truth = { path = "../dw-truth" }
dw-types = { path = "../dw-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
