### Power/parametric table extraction v2 — Qwen3.8-27B TP2, asus2+dgx1 fabric
### Data: results/lora-v2-pairs (quote-native catalog claims, ~15K+ pairs)
### Base: Qwen3.8-27B — FP8 weights on dgx1, QLoRA 4-bit for training
### Rig: asus2 (gx10-26b6) + dgx1 (spark-e10b) via 200GbE switched fabric

model_name_or_path: /training/models/Qwen3.8-27B-FP8
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false

# QLoRA — train through 4-bit quant (disk: asus2 has 17GB free, can't hold BF16)
quantization_bit: 4
quantization_method: bitsandbytes

dataset: power_tables_v2_train
dataset_dir: /training/datasets/power-tables-v2
template: qwen3_vl_nothink
cutoff_len: 16384
preprocessing_num_workers: 8
dataloader_num_workers: 2

output_dir: /training/checkpoints/power-tables-qwen38-27b-tp2-v2
logging_steps: 10
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
report_to: none

# TP2 across asus2+dgx1 via fabric — multi-node torchrun
tensor_parallel_size: 2
force_use_torchrun: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 0.00005
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
seed: 1788172800
data_seed: 1788172800
ddp_timeout: 180000000
