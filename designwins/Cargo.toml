[workspace]
resolver = "2"
members = ["crates/dw-types", "crates/dw-pdf", "crates/dw-parity", "crates/dw-normalize", "crates/dw-truth", "crates/dw-decide", "crates/dw-knives", "crates/dw-funnel", "crates/dw-evidence"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/anomalyco/harnessv1"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
float_cmp = "warn"
indexing_slicing = "warn"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
