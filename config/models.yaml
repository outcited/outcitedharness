  # Bulk datasheet vision lane (2026-09-13). DeepSeek V4 Flash Vision Exp via
  # OpenRouter. REQUIRES reasoning effort low + 32k budget: without headroom the
  # model burns the entire completion budget on reasoning_tokens and returns
  # empty content (finish_reason=length). On pages it completes, extraction
  # matches glm5v_turbo (58/66 identical row counts) at ~1/6 the cost, and it
  # beat GLM on a 100-row Infineon pin table (0.94 vs 0.385 grounding).
  # Overflow rate ~24% on multi-brand corpus: escalate finish_reason=length
  # to glm5v_turbo. Disabled from dispatch; comparison scripts select it
  # explicitly.
  ds_v4_vision:
    enabled: false
    tier: 3
    display_name: "DeepSeek V4 Flash Vision Exp (bulk vision lane)"
